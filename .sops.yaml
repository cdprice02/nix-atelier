# sops encryption config — determines which age recipients a given path
# gets encrypted for. See modules/secrets-sops.nix for how this is consumed
# (opt-in only, via user.nix's useSops = true;).
keys:
  - &owner age16lfhy8r6zfa95r2hk5hfc6jvlaxrxe8m0nqcdcrkxyj8hmxd8czs9djzmk
creation_rules:
  - path_regex: ^secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *owner
