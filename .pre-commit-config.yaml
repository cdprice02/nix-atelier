repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # alejandra and markdownlint run via `language: system`, resolving to the
  # binaries on PATH inside `nix develop` (devShells.default in flake.nix)
  # rather than pre-commit fetching its own pinned rev of each tool. This
  # keeps pre-commit, `nix fmt`, and CI's lint-alejandra/lint-markdownlint
  # jobs on the exact same nixpkgs-pinned version instead of three
  # independently-versioned sources of the same tool. Run `nix develop`
  # (or have direnv load it) before `pre-commit run` for these to resolve.
  - repo: local
    hooks:
      - id: alejandra
        name: alejandra
        entry: alejandra
        language: system
        types: [file]
        files: \.nix$
      # Every tracked .md, not a hand-listed subset — pre-commit only ever
      # passes staged files, which are tracked by definition, so this matches
      # what `just _lint-markdownlint` selects via `git ls-files`. Submodule
      # content under config/ is excluded by .markdownlintignore.
      - id: markdownlint
        name: markdownlint
        entry: markdownlint
        language: system
        types: [markdown]
