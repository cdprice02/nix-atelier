name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Evaluate the flake and output profile name lists for downstream matrices ──
  # Only feeds build-linux/build-darwin below, so it's gated the same way —
  # no point listing profiles for a build matrix that isn't going to run.
  get-profiles:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      linux:  ${{ steps.list.outputs.linux }}
      darwin: ${{ steps.list.outputs.darwin }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-linux-eval-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-linux-eval-
          gc-max-store-size-linux: 2147483648
      - id: list
        run: |
          mkdir -p "$HOME/.nix-config" && cp user.nix.example "$HOME/.nix-config/user.nix"
          LINUX=$(nix shell nixpkgs#just -c just _list-linux-profiles)
          echo "linux=$LINUX" >> "$GITHUB_OUTPUT"
          DARWIN=$(nix shell nixpkgs#just -c just _list-darwin-profiles | jq -c '[.[] | {config: .}]')
          echo "darwin=$DARWIN" >> "$GITHUB_OUTPUT"

  # ── nix flake check + validate the example identity file ─────────────────────
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-linux-eval-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-linux-eval-
          gc-max-store-size-linux: 2147483648
      - run: mkdir -p "$HOME/.nix-config" && cp user.nix.example "$HOME/.nix-config/user.nix"
      - run: nix shell nixpkgs#just -c just check
      - run: nix eval --file user.nix.example

  # ── Fast: eval every profile's derivation path without building ──────────────
  # Runs on every push/PR (unlike build-linux/build-darwin below, which only
  # run at merge-to-main/manual-dispatch gates) — catches type errors, missing
  # options, and assertion failures in seconds. No matrix: `just eval-all`
  # loops over all 20 profiles internally. No QEMU/Rosetta: evaluating a
  # foreign-arch derivation needs no emulation, only building one does.
  eval-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-linux-eval-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-linux-eval-
          gc-max-store-size-linux: 2147483648
      - run: mkdir -p "$HOME/.nix-config" && cp user.nix.example "$HOME/.nix-config/user.nix"
      - run: nix shell nixpkgs#just -c just eval-all

  # ── Full activation-package build for every Linux profile (including aarch64) ─
  # All 16 profiles share one cache key — profiles overlap heavily in store
  # content, so separate keys would fragment the 10 GB GHA cache quota.
  #
  # Gated to push-to-main + manual dispatch, not every PR: this repo has no
  # tagged-release process to gate on (personal config, not a versioned
  # library), so "important gate" = merge to main (the point you'd actually
  # pull and apply this config for real). Every PR still gets full eval
  # coverage (eval-all above) plus 8 profiles' worth of real build coverage
  # for free via flake-check's own `checks` output.
  build-linux:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: get-profiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.get-profiles.outputs.linux) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-platforms = aarch64-linux
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-linux-build-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-linux-build-
          gc-max-store-size-linux: 4294967296
      - run: mkdir -p "$HOME/.nix-config" && cp user.nix.example "$HOME/.nix-config/user.nix"
      - run: nix shell nixpkgs#just -c just _build-linux ${{ matrix.profile }}

  # ── Full system build for every Darwin profile ────────────────────────────────
  # All builds run on macos-14 (Apple Silicon). x86_64-darwin configs are built
  # via Rosetta 2 using extra-platforms = x86_64-darwin — same pattern as QEMU
  # for aarch64-linux. macos-13 (Intel) runners are deprecated and unavailable.
  # Gated the same way as build-linux above, same reasoning.
  build-darwin:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: get-profiles
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.get-profiles.outputs.darwin) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-platforms = x86_64-darwin
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-macos-build-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-macos-build-
          gc-max-store-size-macos: 4294967296
      - run: mkdir -p "$HOME/.nix-config" && cp user.nix.example "$HOME/.nix-config/user.nix"
      - run: nix shell nixpkgs#just -c just _build-darwin ${{ matrix.config }}

  # ── Lint: each tool is a separate job so failures are individually named ──────
  # All lint jobs share one cache key — they all pull from the same nixpkgs
  # revision, so their store content overlaps almost entirely.
  lint-alejandra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-linux-lint-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-linux-lint-
          gc-max-store-size-linux: 1073741824
      - run: nix shell nixpkgs#just -c just _lint-alejandra

  lint-statix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-linux-lint-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-linux-lint-
          gc-max-store-size-linux: 1073741824
      - run: nix shell nixpkgs#just -c just _lint-statix

  lint-deadnix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-linux-lint-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-linux-lint-
          gc-max-store-size-linux: 1073741824
      - run: nix shell nixpkgs#just -c just _lint-deadnix

  lint-markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-linux-lint-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-linux-lint-
          gc-max-store-size-linux: 1073741824
      - run: nix shell nixpkgs#just -c just _lint-markdownlint
