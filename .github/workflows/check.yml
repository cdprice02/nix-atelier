name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # cache-nix-action's purge (#112, every job below) deletes old cache
  # generations via the Actions API, which needs this scope explicitly --
  # confirmed against the action's own README, not assumed. A fork PR's
  # GITHUB_TOKEN is capped to read-only by GitHub regardless of what a
  # workflow requests, so this only takes effect for same-repo runs.
  actions: write

jobs:
  # ── Evaluate the flake and output profile name lists for downstream matrices ──
  # Feeds build-linux-x86_64/build-linux-aarch64/build-darwin below, all three
  # of which only run at the push/dispatch gate, so this stays gated the same
  # way rather than paying its eval cost on every PR for no consumer there.
  get-profiles:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      linux-x86_64:  ${{ steps.list.outputs.linux-x86_64 }}
      linux-aarch64: ${{ steps.list.outputs.linux-aarch64 }}
      darwin:        ${{ steps.list.outputs.darwin }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31.11.0
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-linux-eval-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-linux-eval-
          gc-max-store-size-linux: 2147483648
          # Keeps only the newest generation of this prefix: without this,
          # every commit's hash-keyed cache accumulates until GitHub's global
          # 10 GB LRU evicts something, and what it evicts isn't necessarily
          # this cache -- see #112. purge-primary-key: never protects the
          # generation this same job just saved from its own purge pass.
          #
          # This prefix is still shared with eval-all's identical block below
          # (unlike nix-linux-build-*, which got split by architecture in the
          # same pass -- see build-linux-x86_64's comment): both jobs run
          # concurrently with no needs: between them, so one job's purge can
          # in principle beat the other's restore to the punch and cost that
          # run a cache miss it would otherwise have had. Accepted rather
          # than split: unlike the build pair, both jobs run the same
          # architecture and do pure `nix eval`, so there's no wrong-content
          # risk, only an occasional slower eval-all run.
          purge: true
          purge-prefixes: nix-linux-eval-
          purge-created: 0
          purge-primary-key: never
      - id: list
        run: |
          mkdir -p "$HOME/.nix-atelier" && cp user.nix.example "$HOME/.nix-atelier/user.nix"
          # _list-linux-profiles-x86_64/-aarch64 each re-run _list-linux-profiles
          # (a full nix eval) internally, only to jq-filter the identical result
          # two different ways. Evaluated once here instead, so the arch split
          # is two jq filters over one eval rather than two.
          LINUX=$(nix shell nixpkgs#just -c just _list-linux-profiles)
          echo "linux-x86_64=$(echo "$LINUX" | jq -c '[.[] | select(endswith("-aarch64") | not)]')" >> "$GITHUB_OUTPUT"
          echo "linux-aarch64=$(echo "$LINUX" | jq -c '[.[] | select(endswith("-aarch64"))]')" >> "$GITHUB_OUTPUT"
          DARWIN=$(nix shell nixpkgs#just -c just _list-darwin-profiles | jq -c '[.[] | {config: .}]')
          echo "darwin=$DARWIN" >> "$GITHUB_OUTPUT"

  # ── nix flake check, per system ───────────────────────────────────────────────
  # A matrix, not a single x86_64-linux job: `checks` (flake.nix) no longer
  # builds any real profile closure (the old `activation-*` entries were
  # removed as dead weight once build-linux-x86_64 below covers the same 4
  # profiles under a better name) -- it's nmt (assertion-level content checks
  # + a handful of small real builds like fzf/zoxide/direnv) plus two trivial
  # pure-eval/diff checks. That makes `nix flake check --impure --system
  # <system>` cheap and safe on every system, including the ones this job
  # didn't cover before: darwin (where modules/lib/hm-compat.nix's
  # x86_64-darwin/25.05-pin option shim had *no* CI coverage at all until
  # this) and aarch64-linux (no arch-conditional logic in this repo's modules
  # today, but that's exactly the kind of gap that reopens silently later --
  # cheap enough to just always check).
  #
  # `just flake-check` defaults to `--system builtins.currentSystem`, which is
  # right for local use but wrong here: the aarch64-linux entry runs on an
  # x86_64 runner (QEMU only adds *build* capability, it doesn't change what
  # `currentSystem` reports), and the x86_64-darwin entry runs on an aarch64
  # runner (same story via Rosetta). Both need `--system` passed explicitly to
  # target the right one rather than silently re-checking the runner's native
  # system twice.
  #
  # QEMU/Rosetta setup mirrors build-linux/build-darwin below exactly --
  # deliberately not novel plumbing.
  flake-check:
    name: flake-check (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
            needsQemu: false
            extraPlatforms: ""
          - system: aarch64-linux
            os: ubuntu-latest
            needsQemu: true
            extraPlatforms: "aarch64-linux"
          - system: aarch64-darwin
            os: macos-14
            needsQemu: false
            extraPlatforms: ""
          - system: x86_64-darwin
            os: macos-14
            needsQemu: false
            extraPlatforms: "x86_64-darwin"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - if: matrix.needsQemu
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: arm64
      - if: matrix.extraPlatforms != ''
        uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            extra-platforms = ${{ matrix.extraPlatforms }}
      - if: matrix.extraPlatforms == ''
        uses: cachix/install-nix-action@v31.11.0
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-checks-${{ matrix.system }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-checks-${{ matrix.system }}-
          gc-max-store-size-linux: 2147483648
          gc-max-store-size-macos: 2147483648
          # Per-system prefix, so this only prunes this matrix entry's own
          # old generations, never another system's (#112).
          purge: true
          purge-prefixes: nix-checks-${{ matrix.system }}-
          purge-created: 0
          purge-primary-key: never
      - run: mkdir -p "$HOME/.nix-atelier" && cp user.nix.example "$HOME/.nix-atelier/user.nix"
      # `flake-check` runs `checks.formatting` (treefmt.nix: nixfmt-rfc-style +
      # statix + deadnix + mdformat) as part of `nix flake check`, once per
      # matrix entry, even though the check's own output doesn't vary by
      # system -- the same redundancy `docs-drift` already accepts. Pulling it
      # into a dedicated single-system job would need `checks` restructured to
      # separate the system-invariant entries from the ones that genuinely
      # need a per-system derivation (the nmt builds), which is a bigger
      # change than this job's own cost justifies at four cheap systems.
      # Accepted, not fixed.
      - run: nix shell nixpkgs#just -c just flake-check ${{ matrix.system }}
      # Only meaningful once (the file's content doesn't vary by system) --
      # kept on this job rather than its own, since it needs the same Nix
      # install regardless and x86_64-linux always runs.
      - if: matrix.system == 'x86_64-linux'
        run: nix eval --file user.nix.example

  # ── Fast: eval every profile's derivation path without building ──────────────
  # Runs on every push/PR: catches type errors, missing options, and
  # assertion failures in seconds. Not redundant with the nmt-based
  # flake-check matrix above: nmt reconstructs a module list by calling
  # mkProfile directly, never through the real mkHomeConfig/mkDarwinConfig
  # wrappers (home-manager-lib.homeManagerConfiguration / darwinSystem, the
  # release-pairing assert, extraSpecialArgs), and only ever builds the `full`
  # tier (+ variants) -- `minimal` is never evaluated through nmt at all. This
  # is the only check that evaluates all 10 *actual* named flake outputs
  # exactly as a user would reference them. No matrix: `just eval-all` loops
  # over all profiles internally. No QEMU/Rosetta: evaluating a foreign-arch
  # derivation needs no emulation, only building one does.
  #
  # Deliberately doesn't consume get-profiles' outputs even though both list
  # the same profiles: get-profiles is gated to push/dispatch only (its sole
  # consumers are the build-* matrices below), while this job has to run on
  # every PR. Depending on a job that's skipped on PRs would skip this one
  # too unless every step grew an `if: needs.get-profiles.result == ...`
  # guard, for a saving of two small `nix eval --json` list calls against the
  # ten real config evals this job actually does. Not worth the coupling.
  eval-all:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31.11.0
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-linux-eval-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-linux-eval-
          gc-max-store-size-linux: 2147483648
          # See get-profiles' identical block above: same prefix, same
          # generation-pruning reasoning (#112).
          purge: true
          purge-prefixes: nix-linux-eval-
          purge-created: 0
          purge-primary-key: never
      - run: mkdir -p "$HOME/.nix-atelier" && cp user.nix.example "$HOME/.nix-atelier/user.nix"
      - run: nix shell nixpkgs#just -c just eval-all

  # ── Full activation-package build, native x86_64 Linux profiles ──────────────
  # Gated to push-to-main + manual dispatch, same as build-linux-aarch64 and
  # build-darwin below: none of the three is a required check, and eval-all
  # plus flake-check's nmt checks already give every PR real coverage without
  # a full build. Real build coverage stays at the merge gate.
  build-linux-x86_64:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: get-profiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.get-profiles.outputs.linux-x86_64) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31.11.0
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          # Arch-scoped, not shared with build-linux-aarch64 below: this key
          # used to be identical across both jobs (nix-linux-build-<hash>,
          # no arch in it), which isn't the same kind of sharing #74 chose
          # for eval/build caches -- that was about profiles within one
          # target system overlapping heavily in Nix's content-addressed
          # store, not two different target systems. Because these two jobs
          # ran in parallel under the same key, whichever job's save landed
          # first silently won it, so the other job's own architecture never
          # actually persisted; adding purge (#112) on the old shared key
          # would also have raced restore against a sibling job's purge for
          # no good reason once that was noticed. Splitting by arch removes
          # both problems: each job now owns its key outright.
          primary-key: nix-linux-build-x86_64-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-linux-build-x86_64-
          gc-max-store-size-linux: 4294967296
          purge: true
          purge-prefixes: nix-linux-build-x86_64-
          purge-created: 0
          purge-primary-key: never
      - run: mkdir -p "$HOME/.nix-atelier" && cp user.nix.example "$HOME/.nix-atelier/user.nix"
      - run: nix shell nixpkgs#just -c just _build-linux ${{ matrix.profile }}

  # ── Full activation-package build, QEMU-emulated aarch64 Linux profiles ──────
  # Gated to push-to-main + manual dispatch, not every PR: this is where the
  # real wall-clock cost in this whole workflow lives, with full-gui-aarch64
  # alone measuring 17.4 min under emulation on a recent main run. Real build
  # coverage stays at the merge gate; every PR still gets full eval coverage
  # (eval-all) and assertion-level content coverage for this exact arch
  # (flake-check's aarch64-linux nmt entry), so this job is specifically the
  # aarch64-under-QEMU backstop, not the only thing standing between a PR and
  # a broken build.
  build-linux-aarch64:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: get-profiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.get-profiles.outputs.linux-aarch64) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: arm64
      - uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            extra-platforms = aarch64-linux
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          # Arch-scoped, mirroring build-linux-x86_64 above: see that job's
          # comment for why this no longer shares a key with it (#112).
          primary-key: nix-linux-build-aarch64-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-linux-build-aarch64-
          gc-max-store-size-linux: 4294967296
          purge: true
          purge-prefixes: nix-linux-build-aarch64-
          purge-created: 0
          purge-primary-key: never
      - run: mkdir -p "$HOME/.nix-atelier" && cp user.nix.example "$HOME/.nix-atelier/user.nix"
      - run: nix shell nixpkgs#just -c just _build-linux ${{ matrix.profile }}

  # ── Full system build for every Darwin profile ────────────────────────────────
  # All builds run on macos-14 (Apple Silicon). x86_64-darwin configs are built
  # via Rosetta 2 using extra-platforms = x86_64-darwin, same pattern as QEMU
  # for aarch64-linux. macos-13 (Intel) runners are deprecated and unavailable.
  # Gated to push-to-main + manual dispatch, same reasoning as
  # build-linux-aarch64 above: real build coverage stays at the merge gate,
  # while flake-check's darwin nmt entries (both arches) give every PR
  # assertion-level coverage of the two darwin systems, including
  # modules/lib/hm-compat.nix's x86_64-darwin/25.05-pin shim.
  build-darwin:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: get-profiles
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.get-profiles.outputs.darwin) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            extra-platforms = x86_64-darwin
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-macos-build-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-macos-build-
          gc-max-store-size-macos: 4294967296
          # The single biggest contributor to the quota pressure in #112:
          # two full generations of this cache alone measured ~4.7 GB before
          # this. Same generation-pruning reasoning as the other caches here.
          purge: true
          purge-prefixes: nix-macos-build-
          purge-created: 0
          purge-primary-key: never
      - run: mkdir -p "$HOME/.nix-atelier" && cp user.nix.example "$HOME/.nix-atelier/user.nix"
      - run: nix shell nixpkgs#just -c just _build-darwin ${{ matrix.config }}

  # Formerly 4 separate lint-* jobs here (alejandra, statix, deadnix,
  # markdownlint), each a named red check on its own tool. Removed: treefmt
  # (see treefmt.nix) collapsed all four into flake.nix's `formatting` check,
  # which the flake-check matrix above already runs on every system, on every
  # PR. Losing the per-tool job name is real (a `formatting` failure means
  # opening the log to see which tool flagged what, not reading the check
  # name) -- traded deliberately for one tool instead of four, see #54.
