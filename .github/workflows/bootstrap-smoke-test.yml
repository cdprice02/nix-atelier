name: Bootstrap smoke test

# Separate workflow, not a job in check.yml: check.yml's `on:` block is
# shared by every job in that file, so adding `schedule:` there would make
# the whole build/lint matrix schedule-eligible, not just this one job.
on:
  push:
    branches: [main]
  # Runs on every PR. This previously did not, on the stated grounds that a
  # from-scratch container install can't reuse check.yml's nix store cache and
  # "would slow every PR" -- but the job had never once completed, so that cost
  # was never actually measured. Its first green run took 1.8 minutes, less
  # than flake-check (3 min) or eval-all (3-4 min), both of which already gate
  # every PR. There is no cost argument, and the three separate bugs found
  # getting it green were all things a new user would have hit first.
  #
  # Contrast build-linux/build-darwin, which stay gated to push-to-main: those
  # genuinely are slow (up to 15 min for the aarch64 GUI profiles).
  pull_request:
  schedule:
    # Weekly as well, to catch rot in things outside this repo's control --
    # the Nix installer, the ubuntu:24.04 base image, upstream flake inputs --
    # which a PR-triggered run wouldn't notice on a quiet week.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Proves the literal command sequence docs/bootstrap.md's WSL2/Linux
  # section tells a new user to type still works, starting from nothing —
  # different from check.yml's build-linux, which already proves every
  # profile builds, but does so via cachix/install-nix-action (not the
  # curl-piped installer the docs use) on a fully-provisioned ubuntu-latest
  # runner (not a bare container) and jumps straight to `nix build
  # .#homeConfigurations.X.activationPackage` (not the docs' own `nix run
  # home-manager -- switch`, which actually *runs* each activation script
  # rather than merely building the package that contains them).
  #
  # Switches minimal first, then full, in the same container: `checks`
  # builds every activation package but never runs one, so this job is the
  # only thing that does -- and minimal alone (sshKey, submoduleOverrides)
  # left four feature-owned scripts completely unexercised: awsConfigSkeleton,
  # claudeCode, and the user-declared nativeInstaller-*/configRepo-* pair.
  # `full` (tiers.full = builtins.attrNames features) is the cheapest way to
  # reach the first two with no extra fixture data.
  # Also proves the realistic upgrade-in-place path (a user who starts
  # minimal and later switches to full on the same machine), for free: both
  # sshKey and submoduleOverrides are documented idempotent, so rerunning
  # them under full costs nothing new to verify. The user-declared
  # nativeInstaller-*/configRepo-* scripts stay out of scope here -- they
  # need their own CI-fixture user.nix pointed at real, stable URLs, which
  # is its own follow-up rather than free with `full`.
  #
  # No macOS equivalent: GitHub Actions has no bare/ephemeral macOS
  # container the way ubuntu:24.04 is for Linux (macos-14 is a persistent
  # pre-provisioned VM) — check.yml's build-darwin already covers macOS
  # build correctness, which is the part that *is* testable that way.
  bootstrap-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ubuntu:24.04
    steps:
      # actions/checkout needs real git for submodule support (its
      # tarball-download fallback doesn't fetch submodules) — bare
      # ubuntu:24.04 has neither git nor curl, so this has to run first.
      # xz-utils is for the Nix installer, not checkout: it ships its binary
      # tarball as .xz and aborts with "you do not have 'xz' installed" before
      # doing any work. ubuntu:24.04 omits it; ubuntu-latest runners have it
      # preinstalled, which is why this only bites in the container.
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates sudo xz-utils

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Store cache, same as every other job -- this job previously had none
      # at all, so every run re-downloaded identical package content from
      # scratch. Doesn't weaken what this job proves: the installer itself
      # (the actual thing being tested -- a genuinely fresh curl-piped
      # single-user install) still runs for real on every run regardless of
      # cache state; only the *packages* home-manager switch pulls in after
      # that get to skip a redundant download. Placed before Nix even exists
      # in the container (restore into a not-yet-created /nix, same as any
      # other fresh-runner cache restore) rather than after, so the Nix
      # installer and the two `home-manager switch` calls all benefit, not
      # just the second one.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-bootstrap-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-bootstrap-
          gc-max-store-size-linux: 2147483648

      # Nix's single-user installer (the one docs/bootstrap.md's WSL2
      # section uses, `--no-daemon`) refuses to run as root; GH Actions
      # containers run as root by default.
      - name: Create a non-root user
        run: |
          useradd -m -s /bin/bash ciuser
          echo 'ciuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
          chown -R ciuser:ciuser "$GITHUB_WORKSPACE"

      # Mirrors docs/bootstrap.md's WSL2 steps 1, 3 (via
      # NIX_CONFIG_USER_FILE instead of a literal ~/.nix-atelier clone path,
      # since the repo's already checked out at $GITHUB_WORKSPACE — see
      # flake.nix's NIX_CONFIG_USER_FILE override), and 7. Steps 2
      # (clone — actions/checkout stands in, the documented git@github.com
      # SSH remote can't authenticate in CI without a deploy key), 4-6,
      # 8-9 aren't exercised: they're either not relevant to a
      # minimal bootstrap (secrets, corporate CA, default shell)
      # or don't affect whether the bootstrap sequence itself still works
      # (SSH key, pre-commit).
      - name: Run the documented bootstrap sequence
        run: |
          cat > /tmp/bootstrap-test.sh <<'SCRIPT'
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          sh <(curl -L https://nixos.org/nix/install) --no-daemon
          . ~/.nix-profile/etc/profile.d/nix.sh
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
          cp user.nix.example user.nix
          # docs/bootstrap.md step 3 is "copy the example, then fill in
          # username/name/email" — copying alone skips the second half, and
          # home-manager refuses to activate when home.username doesn't match
          # $USER ("USER is ciuser, expected yourusername"). Substituting the
          # real account name performs the documented edit, so the sequence
          # under test stays the one the docs actually describe.
          sed -i "s/^  username = \"yourusername\";/  username = \"$(id -un)\";/" user.nix
          grep -q "username = \"$(id -un)\";" user.nix \
            || { echo "user.nix username substitution failed:"; cat user.nix; exit 1; }
          export NIX_CONFIG_USER_FILE="$PWD/user.nix"
          # -b bk mirrors the documented command. useradd -m seeds
          # /home/ciuser with /etc/skel's .bashrc and .profile, exactly like a
          # real distro or WSL2 install, and Home Manager aborts rather than
          # clobber them. This is the single most likely first-run failure for
          # a new user, so the sequence under test has to cover it.
          nix run home-manager -- switch --flake .#minimal --impure -b bk
          # No -b bk here: minimal's own switch already created the one-time
          # backups on first run, and this activates over that existing
          # generation rather than starting fresh -- exactly the
          # already-activated state the sshKey/submoduleOverrides idempotency
          # guards exist for. Real network calls: claudeCode's installer
          # (claude.ai/install.sh) actually runs here, same as the Nix
          # installer curl above -- not stubbed, since the point is proving
          # the real script, not a mock of it.
          nix run home-manager -- switch --flake .#full --impure
          SCRIPT
          chmod +x /tmp/bootstrap-test.sh
          chown ciuser:ciuser /tmp/bootstrap-test.sh
          su - ciuser -c "GITHUB_WORKSPACE='$GITHUB_WORKSPACE' /tmp/bootstrap-test.sh"
