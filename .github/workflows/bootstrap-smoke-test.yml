name: Bootstrap smoke test

# Separate workflow, not a job in check.yml: check.yml's `on:` block is
# shared by every job in that file, so adding `schedule:` there would make
# the whole build/lint matrix schedule-eligible, not just this one job.
on:
  push:
    branches: [main]
  # Runs on every PR. This previously did not, on the stated grounds that a
  # from-scratch container install can't reuse check.yml's nix store cache and
  # "would slow every PR" -- but the job had never once completed, so that cost
  # was never actually measured. Its first green run took 1.8 minutes, less
  # than flake-check (3 min) or eval-all (3-4 min), both of which already gate
  # every PR. There is no cost argument, and the three separate bugs found
  # getting it green were all things a new user would have hit first.
  #
  # Contrast build-linux/build-darwin, which stay gated to push-to-main: those
  # genuinely are slow (up to 15 min for the aarch64 GUI profiles).
  pull_request:
  schedule:
    # Weekly as well, to catch rot in things outside this repo's control --
    # the Nix installer, the ubuntu:24.04 base image, upstream flake inputs --
    # which a PR-triggered run wouldn't notice on a quiet week.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # cache-nix-action's purge (#112) needs this scope to delete old cache
  # generations via the Actions API. See check.yml's identical block for the
  # same reasoning: fork PRs get a read-only token regardless.
  actions: write

jobs:
  # Proves the literal command sequence docs/bootstrap.md's WSL2/Linux
  # section tells a new user to type still works, starting from nothing:
  # a template scaffold (#122), not a clone of this repo. Different from
  # check.yml's build-linux, which already proves every profile builds, but
  # does so via cachix/install-nix-action (not the curl-piped installer the
  # docs use) on a fully-provisioned ubuntu-latest runner (not a bare
  # container) and jumps straight to `nix build
  # .#homeConfigurations.X.activationPackage` (not the docs' own `nix run
  # home-manager -- switch`, which actually *runs* each activation script
  # rather than merely building the package that contains them).
  #
  # `checks` builds every activation package but never runs one, so this job
  # is the only thing that does. `full` (tiers.full = builtins.attrNames
  # features) reaches every feature-owned activation script (sshKey,
  # submoduleOverrides, awsConfigSkeleton, claudeCode) with no extra fixture
  # data; there's no `minimal`-then-`full` upgrade-in-place run anymore
  # (the old rationale for it, exercising sshKey/submoduleOverrides twice)
  # since a fresh scaffold only ever starts from one config.
  #
  # macOS gets its own sibling job below (darwin-switch-smoke-test, #101)
  # rather than a variant of this one: GitHub Actions has no bare/ephemeral
  # macOS container the way ubuntu:24.04 is for Linux (macos-14 is a
  # persistent pre-provisioned VM), so it can't reuse the useradd/container
  # scaffolding here, and it needs sudo for a real system-level
  # darwin-rebuild switch rather than a plain home-manager generation.
  bootstrap-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ubuntu:24.04
    steps:
      # actions/checkout needs real git for submodule support (its
      # tarball-download fallback doesn't fetch submodules), and bare
      # ubuntu:24.04 has neither git nor curl, so this has to run first.
      # xz-utils is for the Nix installer, not checkout: it ships its binary
      # tarball as .xz and aborts with "you do not have 'xz' installed" before
      # doing any work. ubuntu:24.04 omits it; ubuntu-latest runners have it
      # preinstalled, which is why this only bites in the container.
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates sudo xz-utils

      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # Store cache, same as every other job -- this job previously had none
      # at all, so every run re-downloaded identical package content from
      # scratch. Doesn't weaken what this job proves: the installer itself
      # (the actual thing being tested -- a genuinely fresh curl-piped
      # single-user install) still runs for real on every run regardless of
      # cache state; only the *packages* home-manager switch pulls in after
      # that get to skip a redundant download. Placed before Nix even exists
      # in the container (restore into a not-yet-created /nix, same as any
      # other fresh-runner cache restore) rather than after, so the Nix
      # installer and the two `home-manager switch` calls all benefit, not
      # just the second one.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-bootstrap-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-bootstrap-
          gc-max-store-size-linux: 2147483648
          # This is the cache #112 found fully evicted: small and refreshed
          # less often than the build/eval caches, so it's first collateral
          # damage from their bloat under GitHub's single global 10 GB LRU,
          # not a problem of its own. Pruned the same way regardless, so it
          # doesn't start accumulating generations as this job's usage grows.
          purge: true
          purge-prefixes: nix-bootstrap-
          purge-created: 0
          purge-primary-key: never

      # Nix's single-user installer (the one docs/bootstrap.md's WSL2
      # section uses, `--no-daemon`) refuses to run as root; GH Actions
      # containers run as root by default.
      - name: Create a non-root user
        run: |
          useradd -m -s /bin/bash ciuser
          echo 'ciuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
          chown -R ciuser:ciuser "$GITHUB_WORKSPACE"

      # Mirrors docs/bootstrap.md's WSL2 steps 1-3 and 6: scaffold via
      # templates.default (#122), fill in identity, apply. `--override-input
      # nix-atelier "path:$GITHUB_WORKSPACE"` points the scaffolded flake at
      # this PR's own checkout rather than the published github: URL, so the
      # job tests the code under review, not the last release. Steps 4-5
      # (secrets, corporate CA) aren't exercised: not relevant to whether the
      # bootstrap sequence itself still works.
      - name: Run the documented bootstrap sequence
        env:
          # nix run home-manager -- switch resolves the home-manager
          # flakeref against the GitHub API. Unauthenticated, that's a
          # per-IP rate limit shared by every runner on the range, and it
          # trips intermittently with no code change involved (see the
          # issue this fixes). GITHUB_TOKEN authenticates the same lookups
          # under this job's own quota instead.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/bootstrap-test.sh <<'SCRIPT'
          set -euo pipefail
          sh <(curl -L https://nixos.org/nix/install) --no-daemon
          . ~/.nix-profile/etc/profile.d/nix.sh
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
          echo "access-tokens = github.com=$GITHUB_TOKEN" >> ~/.config/nix/nix.conf
          mkdir -p ~/my-config && cd ~/my-config
          nix flake init -t "$GITHUB_WORKSPACE#default"
          # docs/bootstrap.md's step is "fill in identity, including
          # username": the template ships a placeholder, and home-manager
          # refuses to activate when home.username doesn't match $USER
          # ("USER is ciuser, expected yourusername"). Substituting the real
          # account name performs the documented edit, so the sequence under
          # test stays the one the docs actually describe.
          sed -i "s/username = \"yourusername\";/username = \"$(id -un)\";/" flake.nix
          grep -q "username = \"$(id -un)\";" flake.nix \
            || { echo "flake.nix username substitution failed:"; cat flake.nix; exit 1; }
          nix flake check --override-input nix-atelier "path:$GITHUB_WORKSPACE"
          # -b bk mirrors the documented command. useradd -m seeds
          # /home/ciuser with /etc/skel's .bashrc and .profile, exactly like a
          # real distro or WSL2 install, and Home Manager aborts rather than
          # clobber them. This is the single most likely first-run failure for
          # a new user, so the sequence under test has to cover it. Real
          # network calls: claudeCode's installer (claude.ai/install.sh)
          # actually runs here, same as the Nix installer curl above -- not
          # stubbed, since the point is proving the real script, not a mock
          # of it.
          nix run home-manager -- switch --override-input nix-atelier "path:$GITHUB_WORKSPACE" --flake .#full -b bk
          SCRIPT
          chmod +x /tmp/bootstrap-test.sh
          chown ciuser:ciuser /tmp/bootstrap-test.sh
          su - ciuser -c "GITHUB_WORKSPACE='$GITHUB_WORKSPACE' GITHUB_TOKEN='$GITHUB_TOKEN' /tmp/bootstrap-test.sh"

  # Real activation, not just a closure build (#101): check.yml's
  # build-darwin only proves darwinConfigurations.<name>.system builds,
  # never that an activation script actually runs on a real macOS system --
  # the same gap the job above closed for Linux (#43). No `needs:` between
  # the two jobs in this file: they run concurrently, same as the rest of
  # this workflow's jobs.
  #
  # Gated to push/dispatch only, unlike the Linux job above (which runs on
  # every PR): this one is meaningfully more expensive -- Homebrew casks
  # actually install (system/darwin.nix's brews/casks are unconditional for
  # every darwin config), real network calls, real disk usage -- matching
  # build-darwin's own push/dispatch gating in check.yml.
  #
  # Scaffolds via templates.default (#122) with the runner's own real
  # $(id -un), not this repo's own placeholder-identity matrix:
  # darwinConfigurations.full-darwin-aarch64 uses "yourusername", which has
  # no corresponding real macOS account for system/darwin.nix's
  # users.users.${user.username} to manage. Runs natively on macos-14's own
  # architecture (aarch64-darwin, Apple Silicon): the x86_64-darwin pair
  # only exists for this repo's own Intel dogfooding machine, and a real
  # activation exercised through Rosetta emulation would prove less about a
  # typical user's Mac than a native run does -- check.yml's build-darwin
  # matrix already covers x86_64-darwin's build correctness via Rosetta.
  darwin-switch-smoke-test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31.11.0
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-darwin-switch-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-darwin-switch-
          gc-max-store-size-macos: 4294967296
          purge: true
          purge-prefixes: nix-darwin-switch-
          purge-created: 0
          purge-primary-key: never

      # Mirrors docs/bootstrap.md's macOS section: scaffold via
      # templates.default, then a real edit of flake.nix (the CI equivalent
      # of the documented `$EDITOR flake.nix` step) filling in a real
      # identity and a darwin config, then the documented first-apply
      # command -- nix-darwin has no separate installer, so the very first
      # apply runs it straight from the flake, exactly as a brand-new
      # machine would. `--override-input nix-atelier "path:$GITHUB_WORKSPACE"`
      # points the scaffold at this PR's own checkout rather than the
      # published github: URL, so this tests the code under review.
      - name: Scaffold and switch a real darwin config
        run: |
          mkdir -p ~/my-config && cd ~/my-config
          nix flake init -t "$GITHUB_WORKSPACE#default"
          cat > flake.nix <<'EOF'
          {
            description = "darwin-switch-smoke-test config";
            inputs.nix-atelier.url = "github:cdprice02/nix-atelier";
            outputs =
              { nix-atelier, ... }:
              nix-atelier.lib.mkConfigs {
                identity = {
                  username = "CI_USERNAME_PLACEHOLDER";
                  name = "CI Runner";
                  email = "ci@example.com";
                  github.user = "ci";
                };
                configs.darwin.full.system = "aarch64-darwin";
              };
          }
          EOF
          sed -i '' "s/CI_USERNAME_PLACEHOLDER/$(id -un)/" flake.nix
          grep -q "username = \"$(id -un)\";" flake.nix \
            || { echo "flake.nix username substitution failed:"; cat flake.nix; exit 1; }
          nix flake check --override-input nix-atelier "path:$GITHUB_WORKSPACE"

          # First-activation-only (docs/troubleshooting.md documents this for
          # real users too): the persistent macos-14 runner already has its
          # own /etc/nix/nix.conf (written by cachix/install-nix-action) and
          # macOS's own default /etc/bashrc/.zshrc, none of which nix-darwin
          # recognizes as its own on a first switch. It refuses to overwrite
          # them silently; renaming is nix-darwin's own documented remedy.
          for f in /etc/nix/nix.conf /etc/bashrc /etc/zshrc; do
            [ -e "$f" ] && sudo mv "$f" "$f.before-nix-darwin"
          done

          sudo nix --extra-experimental-features "nix-command flakes" \
            run nix-darwin -- switch --flake .#full --override-input nix-atelier "path:$GITHUB_WORKSPACE"
